
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Caurivo — AI CFO</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111827;--line:#263348;--text:#edf4ff;--muted:#91a0b8;--blue:#58a6ff;--cyan:#49e1d0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,Arial}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:225px;padding:22px 14px;background:#0d1321;border-right:1px solid var(--line);flex-shrink:0}
.logo{font-size:23px;font-weight:800;letter-spacing:1px;margin:8px 10px 4px}
.logo span{color:var(--cyan)}
.tag{font-size:11px;color:var(--muted);margin:0 10px 28px}
nav button{display:block;width:100%;text-align:left;border:0;border-radius:9px;padding:12px;margin:4px 0;background:transparent;color:#aab8ce}
nav button:hover,nav button.active{background:#172942;color:#71dfff}
main{flex:1;min-width:0;padding:24px;max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:26px;margin:0 0 6px}
p,.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:#172238;color:white;padding:10px 14px;border-radius:9px}
.primary{background:linear-gradient(100deg,#167be8,#6555e9);border:0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:linear-gradient(145deg,#121d30,#101624);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;min-width:0}
.metric{font-size:26px;font-weight:750;margin:12px 0}
.up{color:var(--cyan)}.down{color:#ff9dba}
.content{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
h2{font-size:16px;margin:0 0 18px}
canvas{width:100%;height:220px;display:block}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border:0}
.pill{font-size:11px;border-radius:20px;background:#183a35;color:#64e5c8;padding:5px 8px}
input,select{background:#0b1322;border:1px solid var(--line);color:white;padding:11px;border-radius:8px;width:100%;margin:8px 0 14px}
label{font-size:13px;color:#aebbd0}
.notice{padding:12px;border-radius:9px;background:#182c40;color:#a8ddff;margin-top:12px}
.mobile{display:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{grid-template-columns:1fr}}
@media(max-width:600px){.app{display:block}aside{width:100%;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.logo{display:inline-block}.tag{display:inline-block;margin:0 0 0 8px}nav{display:flex;overflow-x:auto;gap:5px;margin-top:12px}nav button{white-space:nowrap;width:auto;margin:0;padding:10px}main{padding:16px}.grid{gap:9px}.card{padding:13px}.metric{font-size:21px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo">◈ CAURI<span>VO</span></div>
  <div class="tag">AI CFO FOR MODERN BUSINESSES</div>
  <nav id="nav"></nav>
  <p class="small">Demo workspace · Sample data</p>
</aside>
<main>
  <div class="top">
    <div><h1 id="heading">Dashboard</h1><div class="muted small" id="subheading">Your financial command centre</div></div>
    <button class="btn primary" id="action">＋ New report</button>
  </div>
  <div id="page"></div>
  <p class="small">CAURIVO DEMO · Illustrative figures, not financial advice.</p>
</main>
</div>
<script>
const sections=[
["Dashboard","Overview"],["Cash Flow","Cash flow"],["Transactions","Transactions"],
["Forecasts","Forecasts"],["AI Insights","AI insights"],["Reports","Reports"],
["Invoices","Invoices"],["Expenses","Expenses"],["Budget","Budget"],
["Customers","Customers"],["Team","Team"],["Settings","Settings"]
];
let current="Dashboard";
const nav=document.getElementById("nav");
const page=document.getElementById("page");
function money(n){return "₹"+n.toLocaleString("en-IN")}
function drawNav(){
nav.innerHTML="";
sections.forEach(([name,label])=>{
const b=document.createElement("button");
b.textContent=label;b.className=name===current?"active":"";
b.onclick=()=>show(name);nav.appendChild(b);
});
}
function dashboard(){
return `<div class="grid">
<div class="card"><div class="muted small">Total revenue</div><div class="metric">₹8.4L</div><span class="up">↑ 12.5%</span><p class="small">Illustrative monthly figure</p></div>
<div class="card"><div class="muted small">Total expenses</div><div class="metric">₹5.2L</div><span class="down">↑ 4.2%</span><p class="small">Illustrative monthly figure</p></div>
<div class="card"><div class="muted small">Net profit</div><div class="metric">₹3.2L</div><span class="up">↑ 8.1%</span><p class="small">Illustrative monthly figure</p></div>
<div class="card"><div class="muted small">Available cash</div><div class="metric">₹6.8L</div><span class="up">Demo balance</span><p class="small">Not connected to a bank</p></div>
</div>
<div class="content">
<div class="card"><h2>Cash flow overview</h2><canvas id="chart"></canvas><div class="muted small">Sample monthly data · ₹ thousands</div></div>
<div class="card"><h2>AI financial insights</h2>
<div class="rowline"><span>Cash reserve</span><span class="pill">Review</span></div>
<p class="small">Compare your cash reserve with expected upcoming payments.</p>
<div class="rowline"><span>Expense control</span><span class="pill">Review</span></div>
<p class="small">Identify recurring costs and investigate unusual increases.</p>
<div class="notice">These are demo suggestions, not conclusions from your actual accounts.</div>
</div></div>`;
}
function chart(){
const c=document.getElementById("chart");if(!c)return;
const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=220;
c.width=w*dpr;c.height=h*dpr;
const x=c.getContext("2d");x.scale(dpr,dpr);
const vals=[30,45,38,58,50,72,65,85,76,94,82,110];
x.strokeStyle="#263348";x.lineWidth=1;
for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,i*h/5);x.lineTo(w,i*h/5);x.stroke()}
function line(values,color){
x.beginPath();x.strokeStyle=color;x.lineWidth=2.5;
values.forEach((v,i)=>{let px=i*w/(values.length-1),py=h-12-v/120*(h-28);i?x.lineTo(px,py):x.moveTo(px,py)});
x.stroke();
}
line(vals,"#58a6ff");
line([20,35,32,42,38,50,48,62,57,67,70,78],"#49e1d0");
}
function formPage(title,fields){
return `<div class="card"><h2>${title}</h2><form id="demoForm">${fields.map(f=>`<label>${f}</label><input required placeholder="Enter ${f.toLowerCase()}">`).join("")}<button class="btn primary" type="submit">Save demo entry</button></form><div id="message"></div></div>`;
}
function show(name){
current=name;drawNav();
document.getElementById("heading").textContent=name;
document.getElementById("subheading").textContent="Manage and understand your business finances";
document.getElementById("action").textContent=name==="Dashboard"?"＋ New report":"＋ Add entry";
if(name==="Dashboard")page.innerHTML=dashboard();
else if(name==="Cash Flow")page.innerHTML=`<div class="card"><h2>Cash flow analysis</h2><p>Review cash inflows, outflows and upcoming obligations.</p><div class="metric">₹6.8L</div><div class="notice">Demo balance only. Connect a verified data source in a future version.</div></div>`;
else if(name==="Transactions")page.innerHTML=`<div class="card"><h2>Recent transactions</h2><div class="rowline"><span>Customer payment</span><span class="up">+₹25,000</span></div><div class="rowline"><span>Office rent</span><span class="down">−₹18,000</span></div><div class="rowline"><span>Software subscription</span><span class="down">−₹2,500</span></div><p class="small">Illustrative transactions only.</p></div>`;
else if(name==="Forecasts")page.innerHTML=`<div class="card"><h2>Financial forecast</h2><p>Explore possible future cash positions using assumptions you provide.</p><label>Expected monthly revenue (₹)</label><input id="rev" type="number" value="500000" min="0"><label>Expected monthly expenses (₹)</label><input id="exp" type="number" value="350000" min="0"><button class="btn primary" id="calc">Calculate demo estimate</button><div id="estimate" class="notice">Enter assumptions to calculate an estimate.</div></div>`;
else if(name==="AI Insights")page.innerHTML=`<div class="card"><h2>Financial insights</h2><p>1. Review upcoming supplier payments.</p><p>2. Compare monthly expenses with your budget.</p><p>3. Keep a cash reserve for unexpected costs.</p><div class="notice">Demo guidance. No AI model or real company data is connected yet.</div></div>`;
else if(name==="Reports")page.innerHTML=`<div class="card"><h2>Reports centre</h2><p>Explore the demo financial summary or print this page.</p><button class="btn" onclick="window.print()">Print / Save as PDF</button></div>`;
else if(name==="Invoices")page.innerHTML=formPage("Create demo invoice",["Customer name","Invoice amount (₹)","Due date"]);
else if(name==="Expenses")page.innerHTML=formPage("Record demo expense",["Expense description","Amount (₹)","Expense category"]);
else if(name==="Budget")page.innerHTML=formPage("Create demo budget",["Budget name","Planned amount (₹)","Period"]);
else if(name==="Customers")page.innerHTML=formPage("Add demo customer",["Customer name","Email address"]);
else if(name==="Team")page.innerHTML=`<div class="card"><h2>Team access</h2><p>Team invitations and permissions will be added with secure account services.</p></div>`;
else page.innerHTML=`<div class="card"><h2>Workspace settings</h2><label>Business name</label><input id="business" value="My Business"><button class="btn primary" id="saveSettings">Save demo setting</button><div id="message"></div><div class="notice">Settings currently apply only to this page session.</div>`;
const form=document.getElementById("demoForm");
if(form)form.onsubmit=e=>{e.preventDefault();document.getElementById("message").textContent="Demo entry accepted. It has not been stored on a server.";};
const calc=document.getElementById("calc");
if(calc)calc.onclick=()=>{let r=Number(document.getElementById("rev").value),e=Number(document.getElementById("exp").value);document.getElementById("estimate").textContent="Estimated monthly difference: "+money(r-e);};
const save=document.getElementById("saveSettings");
if(save)save.onclick=()=>document.getElementById("message").textContent="Demo setting updated for this screen.";
if(name==="Dashboard")chart();
if(document.getElementById("demoForm") && typeof caurivoRenderSavedEntries==="function") caurivoRenderSavedEntries();
}
document.getElementById("action").onclick=()=>show(current==="Dashboard"?"Reports":current);
window.addEventListener("resize",()=>{if(current==="Dashboard")chart()});
show("Dashboard");

/* CAURIVO DEMO STORAGE: local to this browser only; not secure server storage. */
const CAURIVO_STORAGE_KEY = "caurivo_demo_entries_v1";
function caurivoReadEntries(){
  try { return JSON.parse(localStorage.getItem(CAURIVO_STORAGE_KEY) || "[]"); }
  catch(error) { return []; }
}
function caurivoWriteEntries(entries){
  localStorage.setItem(CAURIVO_STORAGE_KEY, JSON.stringify(entries));
}
function caurivoRenderSavedEntries(){
  const message = document.getElementById("message");
  const form = document.getElementById("demoForm");
  if (!message || !form) return;
  const titleNode = form.querySelector("h2");
  const title = titleNode ? titleNode.textContent : "Demo entries";
  const entries = caurivoReadEntries().filter(entry => entry.type === title);
  const wrap = document.createElement("div");
  wrap.style.marginTop = "16px";
  const heading = document.createElement("h3");
  heading.textContent = "Saved on this device (" + entries.length + ")";
  wrap.appendChild(heading);
  if (!entries.length) {
    const p = document.createElement("p");
    p.className = "small";
    p.textContent = "No saved demo entries yet.";
    wrap.appendChild(p);
  } else {
    entries.slice().reverse().forEach(entry => {
      const item = document.createElement("div");
      item.className = "rowline";
      const details = document.createElement("div");
      entry.fields.forEach(field => {
        const line = document.createElement("div");
        line.textContent = field.label + ": " + field.value;
        details.appendChild(line);
      });
      const date = document.createElement("div");
      date.className = "small muted";
      date.textContent = entry.savedAt;
      item.appendChild(details);
      item.appendChild(date);
      wrap.appendChild(item);
    });
  }
  message.replaceChildren(wrap);
}
document.addEventListener("submit", function(event){
  const form = event.target;
  if (!form || form.id !== "demoForm") return;
  try {
    const titleNode = form.querySelector("h2");
    const labels = Array.from(form.querySelectorAll("label"));
    const inputs = Array.from(form.querySelectorAll("input, select"));
    const fields = inputs.map((input, index) => ({
      label: labels[index] ? labels[index].textContent : "Field " + (index + 1),
      value: input.value.trim()
    }));
    const entries = caurivoReadEntries();
    entries.push({
      type: titleNode ? titleNode.textContent : "Demo entry",
      fields,
      savedAt: new Date().toLocaleString()
    });
    caurivoWriteEntries(entries);
    setTimeout(caurivoRenderSavedEntries, 0);
  } catch(error) {
    const message = document.getElementById("message");
    if (message) message.textContent = "Could not save this demo entry in this browser.";
  }
}, true);

</script>
</body>
</html>
